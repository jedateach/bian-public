# BIAN v14 GraphQL Schema - Query Operations
# ==========================================
#
# This file defines all read operations (queries) for the Customer Workbench
# proof-of-concept scope.  Each query maps to a BIAN `Retrieve` operation on
# the corresponding Service Domain.
#
# BIAN Retrieve operations return the Control Record (CR) or a specific
# Behavior Qualifier (BQ) sub-entity.
#
# Naming convention:
#   - Retrieve CR   → `<serviceDomain>(id: ID!): <ControlRecordType>`
#   - Retrieve BQ   → `<serviceDomain><BQ>(parentId, bqId): <BQType>`
#
# Source: BIAN Release 14.0.0 Semantic APIs (OAS 3.x)

type Query {

  # -------------------------------------------------------------------------
  # Customer Workbench
  # -------------------------------------------------------------------------

  """
  Retrieve a Customer Workbench operating session by its unique identifier.
  Maps to: GET /CustomerWorkbench/{customerworkbenchid}/Retrieve
  """
  customerWorkbenchSession(
    """The unique identifier of the customer workbench session."""
    customerWorkbenchId: ID!
  ): CustomerWorkbenchSession

  """
  Retrieve all workbench sessions for a given customer.
  Convenience query not directly mapped to a single BIAN endpoint,
  equivalent to a filtered retrieve of CustomerWorkbenchOperatingSession.
  """
  customerWorkbenchSessions(
    """Filter sessions by customer reference."""
    customerReference: String
  ): [CustomerWorkbenchSession!]!

  """
  Retrieve a specific browsing sub-session within a workbench session.
  Maps to: GET /CustomerWorkbench/{cwbId}/Browsing/{browsingId}/Retrieve
  """
  customerWorkbenchBrowsing(
    """The parent workbench session identifier."""
    customerWorkbenchId: ID!
    """The browsing sub-session identifier."""
    browsingId: ID!
  ): SessionBrowsing

  """
  Retrieve a specific contact within a workbench session.
  Maps to: GET /CustomerWorkbench/{cwbId}/Contact/{contactId}/Retrieve
  """
  customerWorkbenchContact(
    """The parent workbench session identifier."""
    customerWorkbenchId: ID!
    """The contact identifier."""
    contactId: ID!
  ): SessionContact

  """
  Retrieve a specific software update record within a workbench session.
  Maps to: GET /CustomerWorkbench/{cwbId}/SWUpdate/{swUpdateId}/Retrieve
  """
  customerWorkbenchSoftwareUpdate(
    """The parent workbench session identifier."""
    customerWorkbenchId: ID!
    """The software update identifier."""
    swUpdateId: ID!
  ): SessionSoftwareUpdate

  """
  Retrieve a product/service access record within a workbench session.
  Maps to: GET /CustomerWorkbench/{cwbId}/ProductandServiceAccess/{id}/Retrieve
  """
  customerWorkbenchProductAndServiceAccess(
    """The parent workbench session identifier."""
    customerWorkbenchId: ID!
    """The product and service access identifier."""
    productAndServiceAccessId: ID!
  ): SessionProductAndServiceAccess

