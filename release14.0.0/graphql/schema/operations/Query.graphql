    legalTermId: ID!
  ): SalesAgreementLegalTerm

  """
  Retrieve a specific regulatory term from a Sales Product Agreement.
  Maps to: GET /SalesProductAgreement/{id}/RegulatoryTerm/{regulatoryTermId}/Retrieve  (ReBQ)
  """
  salesAgreementRegulatoryTerm(
    """Unique identifier of the sales product agreement."""
    salesProductAgreementId: ID!
    """Unique identifier of the regulatory term."""
    regulatoryTermId: ID!
  ): SalesAgreementRegulatoryTerm

  """
  Retrieve all Sales Product Agreements for a given customer.
  Convenience query (BIAN pattern: filter on customerReference).
  """
  salesProductAgreementsByCustomer(
    """The customer reference (party ID) to look up."""
    customerReference: String!
  ): [SalesProductAgreementRecord!]!

