  """
  Retrieve a balance snapshot for a current account.
  Maps to: GET /CurrentAccount/{id}/AccountBalance/{balanceId}/Retrieve
  """
  currentAccountBalance(
    """The current account identifier."""
    currentAccountId: ID!
    """The balance record identifier."""
    accountBalanceId: ID!
  ): CurrentAccountBalanceRecord

  """
  Retrieve a specific deposit on a current account.
  Maps to: GET /CurrentAccount/{id}/Deposit/{depositId}/Retrieve
  """
  currentAccountDeposit(
    """The current account identifier."""
    currentAccountId: ID!
    """The deposit identifier."""
    depositId: ID!
  ): CurrentAccountDeposit

  """
  Retrieve a specific withdrawal from a current account.
  Maps to: GET /CurrentAccount/{id}/Withdrawal/{withdrawalId}/Retrieve
  """
  currentAccountWithdrawal(
    """The current account identifier."""
    currentAccountId: ID!
    """The withdrawal identifier."""
    withdrawalId: ID!
  ): CurrentAccountWithdrawal

  """
  Retrieve a direct debit mandate on a current account.
  Maps to: GET /CurrentAccount/{id}/DirectDebitMandate/{mandateId}/Retrieve
  """
  currentAccountDirectDebitMandate(
    """The current account identifier."""
    currentAccountId: ID!
    """The direct debit mandate identifier."""
    directDebitMandateId: ID!
  ): CurrentAccountDirectDebitMandate

  """
  Retrieve a sweep arrangement on a current account.
  Maps to: GET /CurrentAccount/{id}/Sweep/{sweepId}/Retrieve
  """
  currentAccountSweep(
    """The current account identifier."""
    currentAccountId: ID!
    """The sweep identifier."""
    sweepId: ID!
  ): CurrentAccountSweep

  """
  Retrieve an issued device for a current account.
  Maps to: GET /CurrentAccount/{id}/IssuedDevice/{deviceId}/Retrieve
  """
  currentAccountIssuedDevice(
    """The current account identifier."""
    currentAccountId: ID!
    """The issued device identifier."""
    issuedDeviceId: ID!
  ): CurrentAccountIssuedDevice

