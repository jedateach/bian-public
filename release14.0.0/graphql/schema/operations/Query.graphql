  """
  Retrieve a specific payment transaction on a current account.
  Maps to: GET /CurrentAccount/{id}/PaymentTransaction/{txId}/Retrieve
  """
  currentAccountPaymentTransaction(
    """The current account identifier."""
    currentAccountId: ID!
    """The payment transaction identifier."""
    paymentTransactionId: ID!
