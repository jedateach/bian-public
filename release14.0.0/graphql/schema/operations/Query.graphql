  """
  customerProductAndServiceDirectory(
    """Unique identifier of the customer's directory entry."""
    customerProductAndServiceDirectoryId: ID!
  ): CustomerProductAndServiceDirectory

  """
  Retrieve a specific product holding from a customer's directory entry.
  Maps to: GET /CustomerProductandServiceDirectory/{id}/Product/{productId}/Retrieve  (ReBQ)
  """
  customerDirectoryProduct(
    """Unique identifier of the customer's directory entry."""
    customerProductAndServiceDirectoryId: ID!
    """Unique identifier of the product entry."""
    productId: ID!
  ): CustomerDirectoryProduct

  """
  Retrieve a specific service subscription from a customer's directory entry.
  Maps to: GET /CustomerProductandServiceDirectory/{id}/Service/{serviceId}/Retrieve  (ReBQ)
  """
  customerDirectoryService(
    """Unique identifier of the customer's directory entry."""
    customerProductAndServiceDirectoryId: ID!
    """Unique identifier of the service entry."""
    serviceId: ID!
  ): CustomerDirectoryService

  """
  Retrieve all product and service directory entries for a given customer reference.
  Convenience query (BIAN pattern: search/filter on customerReference).
  """
  customerProductAndServiceDirectoryByCustomer(
    """The customer reference (party ID) to look up."""
    customerReference: String!
  ): CustomerProductAndServiceDirectory

