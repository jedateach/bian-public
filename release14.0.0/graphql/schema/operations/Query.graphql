  customerReportingArrangement(
    """The customer position identifier."""
    customerPositionId: ID!
    """The reporting arrangement identifier."""
    reportingArrangementId: ID!
  ): CustomerReportingArrangement

  # -------------------------------------------------------------------------
  # Customer Product and Service Directory
  # -------------------------------------------------------------------------

  """
  Retrieve the product and service directory entry for a customer, listing all
